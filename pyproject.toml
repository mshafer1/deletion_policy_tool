[project]
name = "deletion_policy_tool"
version = "0.1.3.dev0"
description = "A script to implement a configurable deletion policy for n folders"
authors = [
    {name = "mshafer1",email = "2565361+mshafer1@users.noreply.github.com"}
]
license = "MIT"
requires-python = ">=3.11,<4"
dynamic = ["dependencies"]
packages = [
    {include = "deletion_policy_tool", from = "src"},
]
scripts = {run-deletion-policy = "deletion_policy_tool:_main"}
readme = "README.md"

[project.urls]
 Repository = "https://github.com/mshafer1/deletion_policy_tool"
 Changelog = "https://github.com/mshafer1/deletion_policy_tool/blob/main/CHANGELOG.md"

[tool.poetry.dependencies]
python-decouple = "^3.8"
click = "^8.4.2"
click-option-group = "^0.5.9"
ryaml = "^0.5.1"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "ni-python-styleguide (>=0.5.1,<0.6.0)",
    "bandit (>=1.9.4,<2.0.0)"
]
test = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-snapshot (>=0.9.0,<0.10.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
