[project]
name = "deletion-policy-tool"
version = "0.1.0"
description = "A script to implement a configurable deletion policy for n folders"
authors = [
    {name = "mshafer1",email = "2565361+mshafer1@users.noreply.github.com"}
]
license = "MIT"
requires-python = ">=3.11,<4"
dynamic = ["dependencies"]
packages = [
    {include = "deletion_policy_tool", from = "src"},
]
scripts = {run-deletion-policy = "deletion_policy_tool.__main__:_main"}

[tool.poetry.dependencies]
python-decouple = "^3.8"
click = "^8.4.2"
pyyaml = "^6.0.3"
click-option-group = "^0.5.9"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "ni-python-styleguide (>=0.5.1,<0.6.0)"
]
test = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-snapshot (>=0.9.0,<0.10.0)"
]
